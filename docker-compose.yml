version: '3.8'

services:
  firecube-pro:
    build: .
    image: firecube-pro:latest
    container_name: firecube-pro
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      - firecube_data:/app/data

volumes:
  firecube_data:
    driver: local
